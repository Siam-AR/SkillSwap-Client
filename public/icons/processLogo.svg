<svg width="188" height="180" viewBox="0 0 188 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spinCircle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating-outer-ring {
      transform-origin: 94px 90px;
      animation: spinCircle 18s linear infinite;
    }
  </style>

  <!-- ROTATING OUTER RING GROUP -->
  <g class="rotating-outer-ring">
    <!-- Frosted Glass Blur Background Circle -->
    <foreignObject x="-77.1429" y="-77.1429" width="342.001" height="334.286">
      <div xmlns="http://www.w3.org/1999/xhtml" style="backdrop-filter:blur(38.57px);clip-path:url(#bgblur_0_taskifa_clip_path);height:100%;width:100%"></div>
    </foreignObject>
    
    <g data-figma-bg-blur-radius="77.1429">
      <!-- Outer Ring Base with Teal Theme Gradient -->
      <rect x="4.50223" y="0.642857" width="178.714" height="178.714" rx="89.3571" fill="url(#paint0_linear_teal)" fill-opacity="0.12"/>
      <rect x="4.50223" y="0.642857" width="178.714" height="178.714" rx="89.3571" stroke="white" stroke-width="1.28571"/>

      <!-- Diagonal Sweeping Accent Arcs -->
      <path d="M183.859 90C183.859 74.2904 179.747 58.8544 171.932 45.2267C164.117 31.599 152.871 20.2544 139.312 12.3206L138.542 13.6362C151.871 21.4356 162.927 32.5881 170.61 45.985C178.293 59.3819 182.335 74.5565 182.335 90H183.859Z" fill="url(#paint2_linear_teal)"/>
      <path d="M58.4231 172.73C43.9825 166.545 31.4124 156.687 21.9627 144.137C12.5129 131.588 6.51265 116.783 4.55844 101.196L6.07085 101.006C7.99197 116.33 13.8906 130.883 23.1803 143.221C32.47 155.558 44.8272 165.248 59.0233 171.329L58.4231 172.73Z" fill="url(#paint3_linear_teal)"/>

      <!-- Glowing Corner Anchor Dots -->
      <circle cx="182.573" cy="92.5725" r="5.14286" fill="url(#paint4_linear_teal)"/>
      <circle cx="5.14286" cy="102.858" r="5.14286" fill="url(#paint5_linear_teal)"/>
    </g>
  </g>

  <!-- UNTOUCHED STATIC CENTER HUB & TASKIFY LOGO -->
  <g transform="translate(34, 30)">
    <!-- Inner Solid Teal Circle Hub -->
    <circle cx="60" cy="60" r="42" fill="url(#hub_gradient)" filter="drop-shadow(0px 8px 16px rgba(0, 150, 137, 0.25))"/>

    <!-- Centered Taskify Logo -->
    <g transform="translate(40, 40) scale(1)">
      <!-- Crisp White Logo Tile Background -->
      <rect width="40" height="40" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Bold 'T' Letter in Deep Slate -->
      <path d="M11 12H29V17H22.5V30H17.5V17H11V12Z" fill="#0F172A"/>
      
      <!-- Dynamic Sweeping Accent Swooshes -->
      <path d="M14 26C18 24 22 26 27 15C25 18 21 21 15 22C14.5 22 14 24 14 26Z" fill="url(#swoosh_grad_1)"/>
      <path d="M12 30C16 28 20 29 27 18C25 21 21 24 13 25C12.5 25 12 28 12 30Z" fill="url(#swoosh_grad_2)" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- Gradients & Definitions -->
  <defs>
    <clipPath id="bgblur_0_taskifa_clip_path" transform="translate(77.1429 77.1429)">
      <rect x="4.50223" y="0.642857" width="178.714" height="178.714" rx="89.3571"/>
    </clipPath>

    <!-- Teal Theme Gradients Mapped to Reference Structure -->
    <linearGradient id="paint0_linear_teal" x1="3.85938" y1="90" x2="84.2361" y2="52.7039" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009689"/>
      <stop offset="0.5" stop-color="#009689"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>

    <linearGradient id="paint2_linear_teal" x1="140.145" y1="11.5714" x2="183.859" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#009689"/>
    </linearGradient>

    <linearGradient id="paint3_linear_teal" x1="63.0022" y1="180" x2="3.85937" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#009689"/>
    </linearGradient>

    <linearGradient id="paint4_linear_teal" x1="178.551" y1="87.4297" x2="189.775" y2="91.1222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009689"/>
      <stop offset="0.497028" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>

    <linearGradient id="paint5_linear_teal" x1="1.12088" y1="97.7148" x2="12.3457" y2="101.407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009689"/>
      <stop offset="0.497028" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>

    <!-- Central Hub Background Gradient (Teal to Mint) -->
    <linearGradient id="hub_gradient" x1="18" y1="18" x2="102" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#009689"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Logo Swoosh Gradients -->
    <linearGradient id="swoosh_grad_1" x1="14" y1="26" x2="27" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009689"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="swoosh_grad_2" x1="12" y1="30" x2="27" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00BFA5"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
</svg>
